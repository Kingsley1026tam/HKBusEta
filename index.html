<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <!-- Prevents pinch-to-zoom and leaves room for standard mobile viewing -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HK Bus ETA Master</title>
    
    <!-- Leaflet.js for Real Routing/Maps without complex keys -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Lucide Icons (mimicking image.png styles) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* CSS VARIABLES FOR THEMES */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --primary-color: #5d3fd3; /* Default image.png purple center */
            --accent-color: #2979ff;
            --nav-bg: #111115;
            --border-color: #2c2c2c;
        }

        [data-theme="light"] {
            --bg-color: #f5f5f7;
            --surface-color: #ffffff;
            --text-color: #1c1c1e;
            --text-muted: #6e6e73;
            --primary-color: #007aff;
            --nav-bg: #e5e5ea;
            --border-color: #d1d1d6;
        }

        [data-theme="yellow"] {
            --primary-color: #ffcc00;
            --accent-color: #ff9500;
        }

        [data-theme="blue"] {
            --primary-color: #3498db;
            --accent-color: #5dade2;
        }

        /* LAYOUT AND SAFETY SPACES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation; /* Removes tap delay */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Leaves explicit safety gap at top/bottom for mobile browser UI address bars */
            padding-bottom: calc(90px + env(safe-area-inset-bottom));
            padding-top: env(safe-area-inset-top);
        }

        .screen {
            flex: 1;
            display: none;
            overflow-y: auto;
            padding: 16px;
        }

        .screen.active {
            display: block;
        }

        /* BOTTOM NAVBAR (Styled precisely matching image.png) */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 5%;
            right: 5%;
            height: 72px;
            background-color: var(--nav-bg);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            z-index: 9999;
            border: 1px solid var(--border-color);
            padding: 0 10px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
            flex: 1;
            font-size: 11px;
            transition: color 0.2s ease;
        }

        .nav-item i {
            width: 22px;
            height: 22px;
            margin-bottom: 4px;
        }

        .nav-item.active {
            color: var(--text-color);
        }

        /* The standalone center circle icon layout from image.png */
        .nav-item.center-action {
            flex: 0 0 64px;
            height: 64px;
            background-color: var(--primary-color);
            border-radius: 50%;
            color: #fff !important;
            transform: translateY(-12px);
            box-shadow: 0 4px 15px rgba(93, 63, 211, 0.4);
        }

        .nav-item.center-action i {
            margin-bottom: 0;
            width: 26px;
            height: 26px;
        }

        /* CUSTOM SPECIAL VEHICLE NUMPAD KEYBOARD */
        .keyboard-container {
            display: flex;
            background: var(--surface-color);
            border-top: 1px solid var(--border-color);
            padding: 12px;
            gap: 12px;
            position: sticky;
            bottom: 0;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            flex: 3;
        }

        .letter-pad {
            flex: 2;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-content: flex-start;
            background: rgba(0,0,0,0.1);
            padding: 6px;
            border-radius: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .key {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }

        .key:active {
            background: var(--primary-color);
            color: #fff;
        }

        .key-wide {
            grid-column: span 2;
        }

        .letter-btn {
            padding: 8px 12px;
            background: var(--bg-color);
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid var(--border-color);
        }

        /* ACCORDION AND MAP ELEMENTS */
        .route-card {
            background: var(--surface-color);
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .route-header {
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            cursor: pointer;
        }

        .route-details {
            display: none;
            padding: 0 14px 14px 14px;
        }

        .route-details.open {
            display: block;
        }

        .map-container {
            height: 180px;
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            background: #222;
            z-index: 1;
        }

        .station-item {
            padding: 10px;
            border-left: 3px solid var(--primary-color);
            margin: 8px 0;
            background: rgba(255,255,255,0.03);
            border-radius: 0 6px 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .eta-badge {
            background: var(--primary-color);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        /* SETTINGS FORM STYLING */
        .settings-group {
            background: var(--surface-color);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .settings-row:last-child { margin-bottom: 0; }

        select, input[type="range"] {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
        }

        /* BANNER CRUDE TALK MESSAGES */
        .system-alert {
            background: rgba(219, 68, 85, 0.15);
            border: 1px solid #db4455;
            color: #ff6b7b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
        }
    </style>
</head>
<body data-theme="dark">

    <!-- TOP ALERT AREA FOR SYSTEM NOTICES / CANTONESE CRUDE COMMENTS -->
    <div style="padding: 12px 16px 0 16px;">
        <div id="crude-banner" class="system-alert" style="display:none;"></div>
    </div>

    <!-- HOME SCREEN (1) -->
    <div id="screen-home" class="screen active">
        <h2 id="home-title">附近巴士站 / Near Stations</h2>
        <div id="nearby-container" style="margin-top: 12px;">
            <!-- Render Dynamic Nearby Data -->
        </div>
    </div>

    <!-- ALL ROUTES SCREEN (2) -->
    <div id="screen-routes" class="screen">
        <h2>所有路線 / Routes</h2>
        <div style="margin: 10px 0;">
            <input type="text" placeholder="快速篩選路線..." style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color); background: var(--surface-color); color: var(--text-color);">
        </div>
        <div id="all-routes-list"></div>
    </div>

    <!-- SEARCH SCREEN (3 - Center Button triggered) -->
    <div id="screen-search" class="screen">
        <h2>搜尋路線 / Search Route</h2>
        <div style="font-size: 28px; font-weight: bold; padding: 12px; background: var(--surface-color); border-radius: 8px; margin: 10px 0; min-height: 54px; border: 1px solid var(--border-color);" id="search-input-display"></div>
        
        <div id="search-results-list" style="margin-bottom: 16px;"></div>

        <!-- Smart Custom Keyboard Panel Layout -->
        <div class="keyboard-container">
            <div class="numpad">
                <div class="key" onclick="pressKey('7')">7</div>
                <div class="key" onclick="pressKey('8')">8</div>
                <div class="key" onclick="pressKey('9')">9</div>
                <div class="key" onclick="pressKey('4')">4</div>
                <div class="key" onclick="pressKey('5')">5</div>
                <div class="key" onclick="pressKey('6')">6</div>
                <div class="key" onclick="pressKey('1')">1</div>
                <div class="key" onclick="pressKey('2')">2</div>
                <div class="key" onclick="pressKey('3')">3</div>
                <div class="key key-wide" onclick="pressKey('0')">0</div>
                <div class="key" onclick="pressKey('DEL')">⌫</div>
            </div>
            <!-- Letter context panel adapts to HK bus codes prefix/suffix matching prefix context strings -->
            <div class="letter-pad" id="dynamic-letter-pad">
                <!-- Smart Letters generated on input -->
            </div>
        </div>
    </div>

    <!-- HISTORY SCREEN (4) -->
    <div id="screen-history" class="screen">
        <h2>搜尋紀錄 / History</h2>
        <div id="history-container" style="margin-top:12px;"></div>
    </div>

    <!-- SETTINGS SCREEN (5) -->
    <div id="screen-settings" class="screen">
        <h2>設定 / Settings</h2>
        
        <div class="settings-group" style="margin-top: 14px;">
            <div class="settings-row">
                <label>介面主題 / App Theme</label>
                <select id="setting-theme" onchange="changeTheme(this.value)">
                    <option value="dark">Dark Theme</option>
                    <option value="light">Light Theme</option>
                    <option value="yellow">Yellow Mode</option>
                    <option value="blue">淺藍色 Mode</option>
                </select>
            </div>
            <div class="settings-row">
                <label>語言模式 / Language</label>
                <select id="setting-lang" onchange="changeLang(this.value)">
                    <option value="cantonese">廣東話模式</option>
                    <option value="official">書面中文 (Official)</option>
                </select>
            </div>
        </div>

        <div class="settings-group">
            <div class="settings-row">
                <label style="font-weight: bold; color: #ff4d4d;">廣東話粗口功能開關</label>
                <input type="checkbox" id="crude-toggle" checked onchange="toggleCrudeMode()">
            </div>
            <div class="settings-row" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <label>粗口烈度程度 (0 - 5): <span id="crude-level-val">3</span></label>
                <input type="range" id="crude-slider" min="0" max="5" value="3" style="width: 100%;" oninput="updateCrudeLevel(this.value)">
            </div>
        </div>
    </div>

    <!-- FLOATING FLOATING NAVIGATION BAR STYLED DIRECTLY FROM image.png -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchScreen('home', this)">
            <i data-lucide="home"></i>
            <span>主頁</span>
        </div>
        <div class="nav-item" onclick="switchScreen('routes', this)">
            <i data-lucide="layers"></i>
            <span>路線</span>
        </div>
        <!-- Center Action styling matched exactly to image.png's solid indigo active focus button -->
        <div class="nav-item center-action" onclick="switchScreen('search', this)">
            <i data-lucide="search"></i>
        </div>
        <div class="nav-item" onclick="switchScreen('history', this)">
            <i data-lucide="clock"></i>
            <span>紀錄</span>
        </div>
        <div class="nav-item" onclick="switchScreen('settings', this)">
            <i data-lucide="user"></i>
            <span>設定</span>
        </div>
    </nav>

    <script>
        // MOCK PUBLIC DATA ARCHITECTURE BASE (Matching HK Gov Bus Data structures)
        const mockRoutes = [
            { route: "1A", company: "KMB", orig: "中秀茂坪", dest: "尖沙咀碼頭", direction: "O" },
            { route: "968", company: "KMB", orig: "元朗(西)", dest: "銅鑼灣(天后)", direction: "I" },
            { route: "E21A", company: "Citybus", orig: "何文田", dest: "東涌(逸東邨)", direction: "O" },
            { route: "A21", company: "Citybus", orig: "紅磡站", dest: "機場", direction: "O" },
            { route: "N21", company: "Citybus", orig: "尖沙咀", dest: "機場", direction: "I" },
        ];

        const mockStations = [
            { id: "st_1", name: "旺角奶路臣街", lat: 22.3194, lng: 114.1694 },
            { id: "st_2", name: "雅蘭中心", lat: 22.3182, lng: 114.1690 },
            { id: "st_3", name: "九龍塘站", lat: 22.3370, lng: 114.1760 }
        ];

        // Global State Variables
        let currentSearchQuery = "";
        let searchHistory = ["1A", "968"];
        let appTheme = "dark";
        let crudeLevel = 3;
        let crudeEnabled = true;
        let mapInstances = {};

        // Cantonese Rude Level Pack Arrays (0-5)
        const crudePhrases = {
            0: ["班車就到，唔好急。", "更新成功！穩陣啦！", "慢慢睇，大把時間。"],
            1: ["好心你快手啲啦，車就黎到喇。", "更新左喇，睇路啊喂！", "入得未？你手腳好慢。"],
            2: ["咪撚遲到啊，班巴士好似開緊黎。", "撳完重新整理喇，急咩啫！", "喂，企定定等車唔好亂黎。"],
            3: ["屌你班車仲有幾分鐘，急到好似投胎咁！", "撳撳撳，更新完喇，睇吓啦仆街。", "你個位好近個站，咪行錯盲摸摸！"],
            4: ["屌你老味！ 班車就到埋站，你仲慢吞吞成隻豬咁！", "狂撳重新整理做乜柒？更新左啦！", "仆街，地圖幫你定位埋，你咪同我行撚錯！"],
            5: ["屌你老母屄！架車衝緊過嚟啦，再唔走你就等食屎啦！", "柒頭，重新整理完喇，擘大你對狗眼睇清楚！", "你條粉腸，盲既都睇到個站喺度，咪行撚錯啊！"]
        };

        // Initialize App UI
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            updateLettersPad();
            loadHistory();
            renderAllRoutes();
            renderNearbyStations();
            triggerCrudeSpeak(1); // Small greeting phrase
        });

        // Dynamic System Comment Generator
        function triggerCrudeSpeak(actionType) {
            if (!crudeEnabled) {
                document.getElementById('crude-banner').style.display = 'none';
                return;
            }
            const phrases = crudePhrases[crudeLevel];
            const randomIndex = Math.floor(Math.random() * phrases.length);
            const banner = document.getElementById('crude-banner');
            banner.innerText = `[廣東話語音助理] : ${phrases[randomIndex]}`;
            banner.style.display = 'block';
        }

        // NAVIGATION CONTROL
        function switchScreen(screenId, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`screen-${screenId}`).classList.add('active');
            if (element) element.classList.add('active');
        }

        // SMART CUSTOM VIRTUAL KEYBOARD PROCESSING
        function pressKey(val) {
            if (val === 'DEL') {
                currentSearchQuery = currentSearchQuery.slice(0, -1);
            } else {
                currentSearchQuery += val;
            }
            document.getElementById('search-input-display').innerText = currentSearchQuery;
            updateLettersPad();
            performSearch();
        }

        function updateLettersPad() {
            const letterPad = document.getElementById('dynamic-letter-pad');
            letterPad.innerHTML = "";
            
            // Generate standard suffix contextual prefix variants dynamic matches for HK routes (A, N, SP, E, X, etc.)
            let choices = ["A", "B", "C", "E", "N", "NA", "P", "R", "S", "X"];
            if (currentSearchQuery.length > 0) {
                choices = ["A", "B", "E", "K", "N", "P", "S", "X", "M", "R"];
            }

            choices.forEach(l => {
                const btn = document.createElement('button');
                btn.className = "key letter-btn";
                btn.innerText = l;
                btn.onclick = () => {
                    currentSearchQuery += l;
                    document.getElementById('search-input-display').innerText = currentSearchQuery;
                    updateLettersPad();
                    performSearch();
                };
                letterPad.appendChild(btn);
            });
        }

        // SEARCH ACTIONS & HISTORY HANDLING
        function performSearch() {
            const resultsList = document.getElementById('search-results-list');
            resultsList.innerHTML = "";
            
            if (currentSearchQuery.trim() === "") return;

            const filtered = mockRoutes.filter(r => r.route.toLowerCase().includes(currentSearchQuery.toLowerCase()));
            
            filtered.forEach(routeObj => {
                const item = document.createElement('div');
                item.className = "route-card";
                item.innerHTML = `
                    <div class="route-header" onclick="selectAndSaveRoute('${routeObj.route}')">
                        <div><strong>${routeObj.company} - ${routeObj.route}</strong></div>
                        <div style="font-size:13px; color:var(--text-muted);">${routeObj.orig} ➔ ${routeObj.dest}</div>
                    </div>
                `;
                resultsList.appendChild(item);
            });
        }

        function selectAndSaveRoute(routeNum) {
            if (!searchHistory.includes(routeNum)) {
                searchHistory.unshift(routeNum);
            }
            loadHistory();
            alert(`已選取路線 / Selected: ${routeNum}`);
            triggerCrudeSpeak(3);
        }

        function loadHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = "";
            searchHistory.forEach(h => {
                const div = document.createElement('div');
                div.className = "station-item";
                div.innerHTML = `<span><i data-lucide="history" style="width:14px;display:inline;margin-right:8px;"></i>${h}</span> <span class="eta-badge" onclick="currentSearchQuery='${h}'; switchScreen('search');">查</span>`;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        // RENDER TOTAL ALL ROUTE CODES LIST (Fast Load, Without stations loaded)
        function renderAllRoutes() {
            const container = document.getElementById('all-routes-list');
            container.innerHTML = "";
            mockRoutes.forEach(r => {
                const card = document.createElement('div');
                card.className = "route-card";
                card.innerHTML = `
                    <div class="route-header" onclick="toggleAccordion('${r.route}')">
                        <div><strong>${r.route}</strong> <span style="font-size:12px; opacity:0.6;">(${r.company})</span></div>
                        <div style="font-size:13px;">${r.orig} 至 ${r.dest} <i data-lucide="chevron-down" style="display:inline-block; vertical-align:middle; width:16px;"></i></div>
                    </div>
                    <div class="route-details" id="details-${r.route}">
                        <!-- Top Map Visualizing Real Continuous Connected Road Layout Structure -->
                        <div id="map-${r.route}" class="map-container"></div>
                        <div style="margin-top:10px; font-weight:bold; font-size:13px;">巴士沿線車站 (點擊車站更新ETA)：</div>
                        <div id="stations-list-${r.route}"></div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        // ACCORDION FOLD LOGIC WITH LEAFLET ROADS CONNECTIVITY LAYER
        function toggleAccordion(routeId) {
            const el = document.getElementById(`details-${routeId}`);
            const isOpen = el.classList.contains('open');
            
            // Close all first
            document.querySelectorAll('.route-details').forEach(d => d.classList.remove('open'));
            
            if (!isOpen) {
                el.classList.add('open');
                triggerCrudeSpeak(4);
                
                // Initialize map asynchronously to ensure layout sizing recalculates nicely
                setTimeout(() => {
                    initRouteMap(routeId);
                    loadRouteStationsETA(routeId);
                }, 150);
            }
        }

        function initRouteMap(routeId) {
            const mapId = `map-${routeId}`;
            if (mapInstances[mapId]) {
                mapInstances[mapId].invalidateSize();
                return; // Prevent multiple initializations
            }

            // Centralized focus coordinates centered around central Mong Kok region
            const map = L.map(mapId, { zoomControl: false }).setView([22.3190, 114.1690], 15);
            mapInstances[mapId] = map;

            // Styled dark canvas tiles
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: 'OpenStreetMap'
            }).addTo(map);

            // Connect stops explicitly via structured pathing points modeling real highway roads layout
            const latlngs = [
                [22.3182, 114.1690],
                [22.3194, 114.1694],
                [22.3250, 114.1710],
                [22.3370, 114.1760]
            ];

            // Real Polyline Connect route path
            L.polyline(latlngs, { color: 'cyan', weight: 4 }).addTo(map);

            // Add station pins
            mockStations.forEach(st => {
                L.circleMarker([st.lat, st.lng], { radius: 6, color: '#5d3fd3', fillColor: '#fff', fillOpacity: 1 })
                 .addTo(map)
                 .bindPopup(st.name);
            });

            // Highlight Mock User Present Position Location Indicator Circle Marker
            L.circleMarker([22.3192, 114.1692], { radius: 8, color: '#ff3333', fillColor: '#ff3333', fillOpacity: 0.7 })
             .addTo(map)
             .bindPopup("你喺呢度 / Current Position");
        }

        function loadRouteStationsETA(routeId) {
            const container = document.getElementById(`stations-list-${routeId}`);
            container.innerHTML = "";

            mockStations.forEach((st, index) => {
                const item = document.createElement('div');
                item.className = "station-item";
                item.onclick = () => { refreshIndividualETA(routeId, st.id); };
                
                // Generate 3 mock realistic upcoming rolling intervals array minutes
                const m1 = Math.floor(Math.random() * 5) + 2;
                const m2 = m1 + Math.floor(Math.random() * 7) + 5;
                const m3 = m2 + Math.floor(Math.random() * 10) + 8;

                item.innerHTML = `
                    <div>
                        <div style="font-weight:bold; font-size:14px;">${index + 1}. ${st.name}</div>
                        <div style="font-size:11px; color:var(--text-muted);">方向: 往市區中心</div>
                    </div>
                    <div style="display:flex; gap: 4px;">
                        <span class="eta-badge">${m1}分</span>
                        <span class="eta-badge" style="opacity:0.8;">${m2}分</span>
                        <span class="eta-badge" style="opacity:0.6;">${m3}分</span>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function refreshIndividualETA(routeId, stationId) {
            triggerCrudeSpeak(5);
            alert(`[${routeId}] 班次已實時重新整理！`);
            loadRouteStationsETA(routeId);
        }

        // SCREEN 1: REALTIME NEARBY STATIONS SEARCH LIST
        function renderNearbyStations() {
            const container = document.getElementById('nearby-container');
            container.innerHTML = "";
            mockStations.forEach(st => {
                const div = document.createElement('div');
                div.className = "station-item";
                div.style.padding = "14px";
                div.innerHTML = `
                    <div>
                        <div style="font-weight:bold;">${st.name}</div>
                        <span style="font-size:12px; color:var(--accent-color);">距離 120米 • 步行約2分鐘</span>
                    </div>
                    <span class="eta-badge" style="background:#4cd964">即時查看</span>
                `;
                div.onclick = () => {
                    switchScreen('routes');
                    toggleAccordion('1A');
                };
                container.appendChild(div);
            });
        }

        // THEMES & CONFIGURATION SETTING CONTROLLER MANAGERS
        function changeTheme(themeName) {
            document.body.setAttribute('data-theme', themeName);
        }

        function changeLang(lang) {
            if (lang === 'official') {
                crudeEnabled = false;
                document.getElementById('crude-banner').style.display = 'none';
            } else {
                crudeEnabled = true;
                triggerCrudeSpeak(1);
            }
        }

        function toggleCrudeMode() {
            crudeEnabled = document.getElementById('crude-toggle').checked;
            triggerCrudeSpeak(0);
        }

        function updateCrudeLevel(val) {
            crudeLevel = parseInt(val);
            document.getElementById('crude-level-val').innerText = val;
            triggerCrudeSpeak(2);
        }
    </script>
</body>
</html>
