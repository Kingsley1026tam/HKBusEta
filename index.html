<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港巴士預報</title>
    <style>
        :root {
            --primary: #0056b3;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --muted: #6c757d;
            --border: #e9ecef;
            --danger: #d9534f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 70px;
        }

        header {
            background-color: var(--primary);
            color: #fff;
            padding: 14px;
            text-align: center;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 12px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .item-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .badge {
            background-color: #e6f0fa;
            color: var(--primary);
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 6px;
            min-width: 50px;
            text-align: center;
        }

        .desc {
            flex-grow: 1;
            margin-left: 12px;
            font-size: 0.9rem;
        }

        .dist {
            color: var(--muted);
            font-size: 0.8rem;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 12px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        /* Station Node Styles */
        .station-node {
            display: flex;
            margin-bottom: 16px;
            position: relative;
        }

        .station-node::before {
            content: "";
            position: absolute;
            left: 7px;
            top: 16px;
            bottom: -20px;
            width: 2px;
            background-color: #ddd;
        }

        .station-node:last-child::before {
            display: none;
        }

        .station-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #fff;
            border: 3px solid var(--primary);
            margin-top: 2px;
            z-index: 1;
        }

        .station-info {
            margin-left: 12px;
            flex-grow: 1;
        }

        .station-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .station-loc {
            font-size: 0.78rem;
            color: var(--muted);
        }

        .eta-group {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .eta-box {
            background: #f1f3f5;
            border-radius: 4px;
            padding: 4px 8px;
            text-align: center;
            flex: 1;
        }

        .eta-time {
            font-weight: 700;
            color: var(--danger);
            font-size: 0.85rem;
            display: block;
        }

        .eta-note {
            font-size: 0.7rem;
            color: var(--muted);
        }

        /* Bottom Tab Bar */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            border-top: 1px solid var(--border);
            height: 56px;
            z-index: 100;
        }

        .nav-tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--muted);
            font-size: 0.75rem;
            cursor: pointer;
            gap: 3px;
        }

        .nav-tab svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .nav-tab.active {
            color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header id="header-title">附近巴士站點</header>

    <div class="container">
        <!-- Home Page -->
        <div id="page-home" class="page active">
            <div class="card">
                <div class="card-title">最近站點：暢達路</div>
                <div class="item-row" onclick="openRoute('1', '大澳 往 梅窩碼頭')">
                    <span class="badge">1</span>
                    <span class="desc">往 梅窩碼頭</span>
                    <span class="dist">150m</span>
                </div>
                <div class="item-row" onclick="openRoute('B4', '港珠澳大橋 往 機場')">
                    <span class="badge">B4</span>
                    <span class="desc">往 機場（循環線）</span>
                    <span class="dist">220m</span>
                </div>
                <div class="item-row" onclick="openRoute('E11', '航天城 往 天后站')">
                    <span class="badge">E11</span>
                    <span class="desc">往 天后站</span>
                    <span class="dist">310m</span>
                </div>
            </div>
        </div>

        <!-- Search Page -->
        <div id="page-search" class="page">
            <input type="text" class="search-input" placeholder="搜尋路線 (例: 1, B4, A11)" oninput="filterRoutes(this.value)">

            <div class="card" id="search-list">
                <div class="card-title">所有路線</div>
                <div class="item-row" onclick="openRoute('1', '大澳 往 梅窩碼頭')">
                    <span class="badge">1</span>
                    <span class="desc">大澳 往 梅窩碼頭</span>
                </div>
                <div class="item-row" onclick="openRoute('B4', '港珠澳大橋 往 機場')">
                    <span class="badge">B4</span>
                    <span class="desc">港珠澳大橋 往 機場</span>
                </div>
                <div class="item-row" onclick="openRoute('A11', '機場 往 北角碼頭')">
                    <span class="badge">A11</span>
                    <span class="desc">機場 往 北角碼頭</span>
                </div>
            </div>

            <!-- Route Detail View -->
            <div class="card" id="route-detail" style="display: none;">
                <div class="card-title" id="detail-title">路線資訊</div>
                <div class="station-node">
                    <div class="station-dot"></div>
                    <div class="station-info">
                        <div class="station-name">機場（客運大樓）</div>
                        <div class="station-loc">暢達路</div>
                        <div class="eta-group">
                            <div class="eta-box"><span class="eta-time">2 分鐘</span><span class="eta-note">實時</span></div>
                            <div class="eta-box"><span class="eta-time">12 分鐘</span><span class="eta-note">實時</span></div>
                            <div class="eta-box"><span class="eta-time">22 分鐘</span><span class="eta-note">時間表</span></div>
                        </div>
                    </div>
                </div>
                <div class="station-node">
                    <div class="station-dot"></div>
                    <div class="station-info">
                        <div class="station-name">青嶼幹線轉車站</div>
                        <div class="station-loc">青嶼幹線</div>
                        <div class="eta-group">
                            <div class="eta-box"><span class="eta-time">15 分鐘</span><span class="eta-note">實時</span></div>
                            <div class="eta-box"><span class="eta-time">25 分鐘</span><span class="eta-note">實時</span></div>
                            <div class="eta-box"><span class="eta-time">35 分鐘</span><span class="note">時間表</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar with SVG Icons -->
    <nav class="bottom-nav">
        <div class="nav-tab active" id="tab-home" onclick="showTab('home')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>附近</span>
        </div>
        <div class="nav-tab" id="tab-search" onclick="showTab('search')">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span>搜尋</span>
        </div>
    </nav>

    <script>
        function showTab(tabName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));

            if (tabName === 'home') {
                document.getElementById('page-home').classList.add('active');
                document.getElementById('tab-home').classList.add('active');
                document.getElementById('header-title').innerText = "附近巴士站點";
            } else {
                document.getElementById('page-search').classList.add('active');
                document.getElementById('tab-search').classList.add('active');
                document.getElementById('header-title').innerText = "搜尋巴士路線";
                document.getElementById('search-list').style.display = "block";
                document.getElementById('route-detail').style.display = "none";
            }
        }

        function filterRoutes(q) {
            const items = document.querySelectorAll('#search-list .item-row');
            document.getElementById('search-list').style.display = "block";
            document.getElementById('route-detail').style.display = "none";

            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(q.toLowerCase()) ? "flex" : "none";
            });
        }

        function openRoute(no, desc) {
            showTab('search');
            document.getElementById('header-title').innerText = "路線詳細資訊";
            document.getElementById('search-list').style.display = "none";
            document.getElementById('route-detail').style.display = "block";
            document.getElementById('detail-title').innerText = no + "：" + desc;
        }
    </script>
</body>
</html>
